name: Bump upstream SHAs

on:
  schedule:
    - cron: "17 1 * * 1" # Mondays 01:17 UTC (08:17 Asia/Saigon)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-shas
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump SHAs
        id: bump
        run: |
          python scripts/bump_shas.py > pr-body.md
          cat pr-body.md

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/bump-upstream-shas
          delete-branch: true
          add-paths: .claude-plugin/marketplace.json
          commit-message: "chore(marketplace): bump upstream plugin SHAs"
          title: "chore(marketplace): bump upstream plugin SHAs"
          body-path: pr-body.md
          labels: dependencies
